name: Bug report
description: Report something that is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Questions and ideas belong in [Discussions](https://github.com/orgs/html2rss/discussions). For security issues, do not file here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the URL or page type, the command or request, and the output you saw.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Gem, web app, or repository version or commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Ruby version, Docker or hosting setup, browser, or OS, as relevant.
  - type: textarea
    id: config
    attributes:
      label: Config snippet (optional)
      description: Paste the feed config or selectors, with any private values removed.
      render: yaml
